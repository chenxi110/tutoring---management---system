# ============================================================
# 上课通教学管理系统 - Docker Compose 一键部署
# 包含：MySQL 8.0 + Spring Boot 应用
# 使用方式：docker-compose up -d
# 访问地址：http://localhost:8081/tutoring-management.html
# 默认账号：admin / admin123
# ============================================================
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: skt-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: skt_db
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - skt-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: skt-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 覆盖数据库连接，指向compose内的mysql服务
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/skt_db?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      JWT_SECRET: skt_secret_key_2024_springboot_v1
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    volumes:
      - skt-upload-data:/app/upload/courseFile

volumes:
  skt-mysql-data:
  skt-upload-data:
