server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:skt_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql

jwt:
  secret: test_secret_key_for_unit_tests_only
  expiration: 604800000
