<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教师家校互通</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #222;
    }
    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
      padding: 18px;
      margin-bottom: 20px;
    }
    h2, h3 { margin: 0 0 16px; }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .col {
      flex: 1 1 240px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #555;
    }
    input, textarea, select, button {
      width: 100%;
      border: 1px solid #d9d9d9;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      background: #1890ff;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    .message-list {
      display: grid;
      gap: 12px;
    }
    .message-item {
      background: #fafafa;
      border: 1px solid #ececec;
      border-radius: 12px;
      padding: 14px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #666;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .reply-box {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
    .reply-item {
      background: #edf6ff;
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
    }
    .badge {
      display: inline-block;
      background: #e6f7ff;
      color: #1890ff;
      border-radius: 999px;
      font-size: 12px;
      padding: 4px 8px;
      margin-top: 8px;
    }
    @media (max-width: 768px) {
      .container { padding: 0 12px 24px; }
      .row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>教师家校互通</h2>
      <div class="row">
        <div class="col">
          <label>选择学生</label>
          <select id="studentSelect"></select>
        </div>
        <div class="col">
          <label>通知标题</label>
          <input id="msgTitle" placeholder="例如：本周作业提醒" />
        </div>
      </div>
      <div style="margin-top: 12px;">
        <label>通知内容</label>
        <textarea id="msgContent" placeholder="请输入通知内容..."></textarea>
      </div>
      <div style="margin-top: 14px;">
        <button type="button" onclick="sendTeacherMessage()">发送通知</button>
      </div>
    </div>

    <div class="card">
      <h3>已发送消息列表</h3>
      <div id="teacherMessageList" class="message-list"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('skt_token') || '';
    const storageUser = localStorage.getItem('skt_user');
    const user = storageUser ? JSON.parse(storageUser) : null;

    function ensureLogin() {
      if (!token) {
        window.location.href = 'tutoring-management.html';
        return false;
      }
      return true;
    }

    function getBaseURL() {
      return localStorage.getItem('skt_api_base') || '/api';
    }

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      };
    }

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: {
          ...authHeaders(),
          ...(options.headers || {})
        }
      });
      if (res.status === 401) {
        localStorage.removeItem('skt_token');
        localStorage.removeItem('skt_user');
        window.location.href = 'tutoring-management.html';
        return null;
      }
      return res.json();
    }

    async function loadStudents() {
      const res = await fetchJson(getBaseURL() + '/students');
      const students = (res && res.data) || [];
      const select = document.getElementById('studentSelect');
      select.innerHTML = '<option value="">请选择学生</option>' +
        students.map(s => '<option value="' + (s.id || '') + '">' + (s.name || '--') + '</option>').join('');
    }

    async function sendTeacherMessage() {
      const studentId = document.getElementById('studentSelect').value;
      const title = document.getElementById('msgTitle').value.trim();
      const content = document.getElementById('msgContent').value.trim();

      if (!studentId) {
        alert('请选择学生');
        return;
      }
      if (!content) {
        alert('通知内容不能为空');
        return;
      }

      const payload = {
        studentId: Number(studentId),
        title: title || '家校通知',
        content: content
      };

      const res = await fetchJson(getBaseURL() + '/messages', {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      if (res && res.code === 200) {
        alert('发送成功');
        document.getElementById('msgTitle').value = '';
        document.getElementById('msgContent').value = '';
        loadTeacherMessages();
      } else {
        alert((res && res.error) || '发送失败');
      }
    }

    async function loadTeacherMessages() {
      const res = await fetchJson(getBaseURL() + '/messages');
      const list = (res && res.data) || [];
      const box = document.getElementById('teacherMessageList');

      if (!list.length) {
        box.innerHTML = '<div class="message-item">暂无消息</div>';
        return;
      }

      box.innerHTML = list.map(item => {
        const replyList = (item.replyList || []).map(reply =>
          '<div class="reply-item"><strong>' + (reply.sender_name || '用户') + '：</strong>' + (reply.content || '') + '</div>'
        ).join('');

        return '<div class="message-item">' +
          '<div class="meta"><span>' + (item.sender_name || '教师') + '</span><span>' + (item.created_at || '') + '</span></div>' +
          '<div style="font-weight:700;">' + (item.title || '通知') + '</div>' +
          '<div style="margin: 10px 0;">' + (item.content || '') + '</div>' +
          '<span class="badge">' + (item.status === 'unread' ? '未读' : '已读') + '</span>' +
          '<div class="reply-box">' + (replyList || '<div class="reply-item">暂无留言</div>') + '</div>' +
          '</div>';
      }).join('');
    }

    function init() {
      if (!ensureLogin()) return;
      loadStudents();
      loadTeacherMessages();
      setInterval(loadTeacherMessages, 30000);
    }

    init();
  </script>
</body>
</html>
