server:
  address: 0.0.0.0
  port: 8081
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/skt_db?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # 默认激活 local profile：本地开发时自动加载 application-local.yml（含真实密钥，已被 .gitignore 忽略）
  # 生产环境通过环境变量 SPRING_PROFILES_ACTIVE=prod 切换，jar 内不含任何明文密钥
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

jwt:
  secret: skt_secret_key_2024_springboot_v1
  expiration: 604800000

# ============================================================
# AI大模型配置 - 当前对接 Agnes-AI（OpenAI 兼容接口，/v1/chat/completions）
# 切换模型只需修改此处配置，无需改动业务代码
# ------------------------------------------------------------
# 密钥安全说明（重要）：
# 1. 本文件会提交到 GitHub，api-key 仅放占位符，严禁写入真实密钥
# 2. 本地开发：真实密钥放在 application-local.yml（已被 .gitignore 忽略，不会提交）
# 3. 生产环境：通过服务器环境变量 AI_API_KEY 注入，jar 包内不得包含明文密钥
# ============================================================
ai:
  base-url: ${AI_BASE_URL:https://apihub.agnes-ai.com/v1}
  # 占位符密钥：本地由 application-local.yml 覆盖，生产由环境变量 AI_API_KEY 注入
  api-key: ${AI_API_KEY:your_agnes_api_key_here}
  model: ${AI_MODEL:agnes-ai}
  system-prompt: 你是一个专业的教学管理助手，帮助教师和家长解决教学相关问题。请用简洁清晰的中文回答。
  timeout: 60

# 文件上传存储配置（课堂文件互传）
file:
  uploadBasePath: ./upload/courseFile/
  maxSingleFileSize: 52428800 #50MB
  allowSuffix: xlsx,xls,docx,doc,pptx,png,jpg,jpeg
